name: F1 - Seguridad y migraciones PostgreSQL CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/scripts/phase1-*.php'
      - '.github/workflows/phase1-security-static.yml'
      - 'backend/tests/security/**'
      - 'backend/database/migrations/**'
      - 'backend/composer.json'
      - 'backend/composer.lock'
      - 'backend/tests/Feature/Security/ExistingCompaniesHttpReadOnlyTest.php'
      - 'backend/tests/Feature/Security/ExistingCompaniesRoleGuardReadOnlyTest.php'
      - 'backend/config/database.php'
      - 'backend/routes/api.php'
      - 'backend/app/Http/Middleware/**'
      - 'backend/app/Support/Tenant/**'
      - 'backend/app/Providers/**'
      - 'backend/tests/Feature/Security/CompanyRoleAuthorizationTest.php'
      - 'backend/tests/Feature/Security/TenantContextNestedTest.php'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1-security-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-script:
    name: Validar auditoria de seguridad F1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Instalar PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, pdo_pgsql
          coverage: none
      - name: Comprobar sintaxis PHP independiente de la base
        run: |
          php -l backend/scripts/phase1-permissions-audit.php
          php -l backend/app/Http/Middleware/RequireCompanyRole.php
          php -l backend/app/Support/Tenant/TenantContext.php
          php -l backend/app/Providers/AppServiceProvider.php
          php -l backend/routes/api.php
          php -l backend/tests/Feature/Security/CompanyRoleAuthorizationTest.php
          php -l backend/tests/Feature/Security/TenantContextNestedTest.php
          php -l backend/database/migrations/2026_10_21_010000_harden_postgres_function_search_path.php
          php -l backend/database/migrations/2026_10_21_020000_close_global_audit_log_read_leak.php
      - name: Verificar barreras de seguridad del script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path("backend/scripts/phase1-permissions-audit.php").read_text()
          required = [
            "environment('local')",
            "app_backend.bnjwxphwtkhblvhsnylj",
            "pg_catalog.pg_class",
            "pg_catalog.pg_proc",
            "has_table_privilege",
            "has_function_privilege",
          ]
          missing = [value for value in required if value not in s]
          assert not missing, f"Faltan controles: {missing}"
          print("PASS: controles estaticos presentes")
          PY
      - name: Resumen de alcance
        run: echo "PASS - sintaxis y controles estaticos. No se ejecutaron consultas SQL ni pruebas RLS contra Supabase."

  postgres-rls-contract:
    name: PostgreSQL 17 - RLS negativo en contenedor temporal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: temporary-ci-only
          POSTGRES_DB: f1_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d f1_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar cliente PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Probar barreras RLS en datos ficticios
        env:
          PGPASSWORD: temporary-ci-only
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: f1_contract
        run: psql -v ON_ERROR_STOP=1 -f backend/tests/security/phase1-rls-contract.sql

  laravel-real-migrations:
    name: Laravel real migrations - isolated PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: temporary-ci-only
          POSTGRES_DB: contabilidad_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d contabilidad_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      APP_KEY: "base64:XQ9v12345678901234567890123456789012345678="
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: contabilidad_ci
      DB_USERNAME: postgres
      DB_PASSWORD: temporary-ci-only
      DB_SSLMODE: disable
      DB_MIGRATIONS_HOST: 127.0.0.1
      DB_MIGRATIONS_PORT: '5432'
      DB_MIGRATIONS_DATABASE: contabilidad_ci
      DB_MIGRATIONS_USERNAME: postgres
      DB_MIGRATIONS_PASSWORD: temporary-ci-only
      DB_MIGRATIONS_SSLMODE: disable
      DB_APP_BACKEND_ROLE_PASSWORD: temporary-app-ci-only
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, pdo_pgsql, xml, curl, zip
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Comprobar PHP 8.5 y lock de Laravel/Pest
        run: |
          php -r 'if (PHP_VERSION_ID < 80500 || PHP_VERSION_ID >= 80600) { fwrite(STDERR, "Se esperaba PHP 8.5\\n"); exit(1); }'
          composer validate --strict --no-check-publish
          composer check-platform-reqs
          composer audit --locked --format=plain
          php artisan --version
          php -r '$lock=json_decode(file_get_contents("composer.lock"),true); foreach ([["packages","laravel/framework","13"],["packages-dev","pestphp/pest","4"]] as $spec) { $found=false; foreach($lock[$spec[0]] as $pkg) { if ($pkg["name"]===$spec[1] && preg_match("/^v?".$spec[2]."\\./",$pkg["version"])) { $found=true; } } if (!$found) { fwrite(STDERR, "Version de lock inesperada: ".$spec[1]."\\n"); exit(1); } }'
      - name: Instalar cliente PostgreSQL para aserciones reales
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Crear roles de plataforma ficticios (solo CI)
        env:
          PGPASSWORD: temporary-ci-only
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: contabilidad_ci
        run: |
          psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN'
          psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE authenticated NOLOGIN'
      # Cinco migraciones exigen por diseño el proyecto Supabase Dev.
      # En PostgreSQL 17 desechable se migra el esquema real independiente
      # del proveedor; estas operaciones quedan pendientes de prueba Supabase:
      # ACL Data API, rotacion de clave, listado global por usuario y empresa B.
      - name: Excluir migraciones atadas a Supabase del PostgreSQL temporal
        run: |
          mkdir -p "$RUNNER_TEMP/supabase-only-migrations"
          for fixture in \
            2026_10_19_000000_restrict_supabase_data_api_grants.php \
            2026_10_19_010000_add_company_economic_profile.php \
            2026_10_20_000000_rotate_app_backend_credential.php \
            2026_10_20_010000_scope_company_listing_to_authenticated_user.php \
            2026_10_20_235900_create_dev_company_b_via_laravel.php; do
            path="database/migrations/$fixture"
            test -f "$path"
            mv "$path" "$RUNNER_TEMP/supabase-only-migrations/"
          done
      - name: Migrar esquema Laravel compatible con PostgreSQL CI
        run: |
          php artisan migrate --database=pgsql_migrations --force --no-interaction
          # Laravel puede informar FAIL aunque el comando exterior no propague
          # correctamente el codigo de salida: exigir todas las anotaciones.
          expected=$(find database/migrations -maxdepth 1 -type f -name '*.php' | wc -l | tr -d '[:space:]')
          actual=$(PGPASSWORD=temporary-ci-only psql -h 127.0.0.1 -U postgres -d contabilidad_ci -X -At -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.migrations')
          echo "Migraciones registradas en CI: $actual/$expected"
          test "$actual" = "$expected"
      - name: Verificar rol app_backend y RLS reales
        working-directory: .
        env:
          PGPASSWORD: temporary-ci-only
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: contabilidad_ci
        run: |
          python3 - <<'PY'
          import subprocess
          sql = """
          DO $$
          DECLARE role_ok boolean; rls_total integer;
          BEGIN
            SELECT rolcanlogin AND NOT rolsuper AND NOT rolbypassrls
              INTO role_ok FROM pg_roles WHERE rolname='app_backend';
            IF NOT COALESCE(role_ok,false) THEN
              RAISE EXCEPTION 'app_backend is missing or privileged';
            END IF;
            SELECT count(*) INTO rls_total FROM pg_class c
              JOIN pg_namespace n ON c.relnamespace=n.oid
              WHERE n.nspname='public' AND c.relrowsecurity AND c.relforcerowsecurity;
            IF rls_total < 1 THEN RAISE EXCEPTION 'no real RLS tables found'; END IF;
            RAISE NOTICE 'PASS: % real tables with FORCE RLS',rls_total;
          END $$;
          """
          subprocess.run(["psql","-v","ON_ERROR_STOP=1","-c",sql],check=True)
          PY

      - name: Probar funcion RLS real del ERP
        env:
          PGPASSWORD: temporary-ci-only
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: contabilidad_ci
        run: psql -v ON_ERROR_STOP=1 -f tests/security/phase1-real-tenant-context.sql
      - name: Auditar ACL y RLS sobre el esquema REAL migrado
        env:
          PGPASSWORD: temporary-ci-only
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: contabilidad_ci
        run: psql -v ON_ERROR_STOP=1 -f tests/security/phase1-real-schema-audit.sql

      - name: Check tenant-local transaction isolation
        env:
          PGPASSWORD: temporary-ci-only
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: contabilidad_ci
        run: psql -v ON_ERROR_STOP=1 -f tests/security/phase1-real-tenant-transactions.sql
      - name: F1.3 - RLS real: escrituras cruzadas denegadas y rollback verificado
        env:
          PGPASSWORD: temporary-ci-only
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: contabilidad_ci
        run: psql -v ON_ERROR_STOP=1 -f tests/security/phase1-real-cross-tenant-writes.sql
      - name: Run isolated Laravel unit tests
        run: ./vendor/bin/pest --testsuite=Unit
      - name: F1.2-F1.3 HTTP y contexto RLS con JUnit obligatorio (solo PG17 CI)
        env:
          DB_USERNAME: app_backend
          DB_PASSWORD: temporary-app-ci-only
        run: |
          ./vendor/bin/pest tests/Feature/Security/CompanyRoleAuthorizationTest.php tests/Feature/Security/TenantContextNestedTest.php --log-junit="$RUNNER_TEMP/f1-roles-junit.xml"
          python3 - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          path = Path(os.environ["RUNNER_TEMP"]) / "f1-roles-junit.xml"
          if not path.is_file():
              raise SystemExit("FAIL: Pest no genero reporte JUnit")
          root = ET.parse(path).getroot()
          cases = root.findall(".//testcase")
          failures = root.findall(".//failure") + root.findall(".//error")
          suites = root.findall(".//testsuite")
          bad_suites = [s.attrib for s in suites if int(s.get("failures", "0")) or int(s.get("errors", "0"))]
          if len(cases) != 12 or failures or bad_suites:
              raise SystemExit(f"FAIL: Pest JUnit total={len(cases)} errores/fallos={len(failures)} suite={bad_suites}")
          print("PASS: Pest JUnit 12 pruebas, 0 fallos")
          PY
      - name: Validate changed security PHP syntax
        run: |
          php -l app/Http/Middleware/RequireCompanyRole.php
          php -l app/Support/Tenant/TenantContext.php
          php -l app/Providers/AppServiceProvider.php
          php -l routes/api.php
          php -l tests/Feature/Security/CompanyRoleAuthorizationTest.php
          php -l tests/Feature/Security/TenantContextNestedTest.php
          php -l database/migrations/2026_10_21_010000_harden_postgres_function_search_path.php
          php -l database/migrations/2026_10_21_020000_close_global_audit_log_read_leak.php
          php -l tests/Feature/Security/ExistingCompaniesRoleGuardReadOnlyTest.php
      - name: Ensayar search_path seguro de las cinco funciones y revertirlo
        env:
          PGPASSWORD: temporary-ci-only
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: contabilidad_ci
        run: psql -v ON_ERROR_STOP=1 -f tests/security/phase1-search-path-rehearsal.sql
