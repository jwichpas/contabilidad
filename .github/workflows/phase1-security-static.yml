name: F1 - Auditoria estatica (sin acceso a bases de datos)

on:
  push:
    branches: [main]
    paths:
      - 'backend/scripts/phase1-*.php'
      - '.github/workflows/phase1-security-static.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1-security-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-script:
    name: Validar auditoria de seguridad F1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Instalar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_pgsql
          coverage: none
      - name: Comprobar sintaxis PHP
        run: |
          php -l backend/scripts/phase1-permissions-audit.php
      - name: Verificar barreras de seguridad del script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path("backend/scripts/phase1-permissions-audit.php").read_text()
          required = [
            "environment('local')",
            "app_backend.bnjwxphwtkhblvhsnylj",
            "pg_catalog.pg_class",
            "pg_catalog.pg_proc",
            "has_table_privilege",
            "has_function_privilege",
          ]
          missing = [value for value in required if value not in s]
          assert not missing, f"Faltan controles: {missing}"
          print("PASS: controles estaticos presentes")
          PY
      - name: Resumen de alcance
        run: echo "PASS - sintaxis y controles estaticos. No se ejecutaron consultas SQL ni pruebas RLS contra Supabase."
