name: Validación frontend

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: TypeScript, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Configurar Node 22 y caché pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependencias verificadas
        run: pnpm install --frozen-lockfile

      - name: Verificar tipos Vue y TypeScript
        run: pnpm typecheck

      - name: Ejecutar pruebas frontend
        run: pnpm test:unit

      - name: Compilar para producción
        run: pnpm build

      - name: Vigilar tamaño del JavaScript inicial
        run: pnpm check:bundle
