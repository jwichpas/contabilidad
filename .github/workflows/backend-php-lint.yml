name: Validación sintáctica PHP

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-php-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-lint-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP 8.4 - sintaxis backend y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
          coverage: none

      - name: Verificar sintaxis de controladores, servicios y pruebas
        run: find backend/app backend/tests -type f -name '*.php' -print0 | xargs -0 -n 1 php -l

      - name: Verificar importación de Schema en controladores
        run: php backend/scripts/check-controller-schema-imports.php

      - name: Verificar sintaxis PowerShell de prueba PostgreSQL 18
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/backend/scripts/phase2-active-rls-docker.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Verificar sintaxis de las migraciones PostgreSQL 18 con guardia local
        run: |
          php -l backend/app/Support/Database/LocalPg18InstallGuard.php
          php -l backend/database/migrations/2026_10_21_010000_harden_postgres_function_search_path.php
          php -l backend/database/migrations/2026_10_21_020000_close_global_audit_log_read_leak.php

      - name: Verificar sintaxis PowerShell del instalador PostgreSQL 18 local
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/backend/scripts/iniciar-postgres18-local.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Verificar sintaxis PHP del preflight PG18
        run: php -l backend/scripts/verificar-preflight-pg18-local.php

      - name: Verificar sintaxis PowerShell del instalador de esquema PG18
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/backend/scripts/instalar-esquema-pg18-local.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
