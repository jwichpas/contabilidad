name: Validación sintáctica PHP

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-php-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-lint-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP 8.4 - sintaxis backend y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
          coverage: none

      - name: Verificar sintaxis de controladores, servicios y pruebas
        run: find backend/app backend/tests -type f -name '*.php' -print0 | xargs -0 -n 1 php -l
