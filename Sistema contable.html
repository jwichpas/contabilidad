<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Libro Mayor Perú · Sistema contable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--surface:#ffffff;--ink:#0f1b3d;--muted:#55617f;--line:#dbe3f3;--brand:#1747d1;--brand-2:#0b2468;--on-brand:#fff;--accent:#d9480f;--on-accent:#fff;--ok:#0f6b3a;--warn:#9a5b00;--soft:#eef3ff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--brand-2);color:#dbe6ff;padding:20px 12px;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto}
aside h1{font-size:17px;margin:0 8px 2px;font-weight:600;color:#fff}
aside small{display:block;margin:0 8px 18px;color:#94acf0}
nav .lnk{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;color:inherit;padding:10px 12px;border-radius:8px;font:inherit;cursor:pointer;min-height:42px}
nav .lnk.top{font-weight:600;margin-top:2px}
nav .lnk.has{color:#fff}
nav .sub{margin:2px 0 6px 14px;padding-left:8px;border-left:1px solid rgba(255,255,255,.18)}
nav .sub .lnk{font-size:14px;padding:8px 10px;min-height:38px;color:#c3d3fb}
.chev{width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .15s;margin-right:3px}
nav [aria-expanded="true"] .chev{transform:rotate(-135deg)}
nav .lnk:hover{background:rgba(255,255,255,.1)}
nav .lnk[aria-current="page"]{background:var(--brand);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #ff8a3d}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding:24px 28px 48px;max-width:1100px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1,h2,h3,.kpi b{font-family:Sora,"Plus Jakarta Sans",system-ui,sans-serif;letter-spacing:-.01em}
h2{font-size:22px;margin:0;font-weight:700}
.sub{color:var(--muted);margin:2px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand);padding:14px 16px;border-radius:4px}
.kpi span{color:var(--muted);font-size:13px}
.kpi b{display:block;font-size:24px;font-weight:600;margin-top:2px}
.kpi.igv{border-left-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;margin-bottom:18px}
.panel h3{margin:0 0 12px;font-size:16px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:13px;background:var(--soft)}
td.n,th.n{text-align:right;white-space:nowrap}
tr.tot td{font-weight:600;border-top:2px solid var(--ink);border-bottom:0}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--muted)}
input,select{width:100%;margin-top:3px;padding:8px 9px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font:inherit}
input[readonly]{background:var(--soft)}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:4px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:none;color:var(--brand);border:1px solid var(--brand)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--brand);border-radius:4px;overflow:hidden}
.seg button{background:none;border:0;padding:7px 16px;font:inherit;color:var(--brand);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);font-weight:600}
.msg{margin:8px 0 0;font-size:14px}
.ok{color:var(--ok)}.bad{color:#c62828}.warn{color:var(--warn)}
.tag{display:inline-block;background:var(--soft);border-radius:3px;padding:1px 7px;font-size:12px}
.empty{color:var(--muted);padding:14px 4px}
.bar{display:none}
.bar strong{font-family:Sora,system-ui,sans-serif;color:var(--brand-2)}
.menu{width:40px;height:40px;display:inline-grid;place-items:center;background:none;border:1px solid var(--line);border-radius:8px;color:var(--brand);cursor:pointer}
.scrim{position:fixed;inset:0;background:rgba(7,16,48,.5);z-index:20;display:none}
@media (min-width:761px) and (max-width:1023px){.app{grid-template-columns:208px 1fr}main{padding:20px 18px 40px}}
@media (max-width:480px){.kpi b{font-size:20px}.btn{width:100%;margin-bottom:6px}.f{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.asiento{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.asiento:first-of-type{border-top:0;margin-top:0;padding-top:0}
.asiento header{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:600}
@media (max-width:760px){
.app{grid-template-columns:1fr}
.bar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px}
.scrim.show{display:block}
aside{position:fixed;top:0;left:0;bottom:0;height:auto;width:290px;max-width:86vw;z-index:30;transform:translateX(-100%);visibility:hidden;transition:transform .22s,visibility 0s .22s;padding:calc(18px + env(safe-area-inset-top,0px)) 12px calc(18px + env(safe-area-inset-bottom,0px))}
aside.open{transform:none;visibility:visible;transition:transform .22s}
nav{display:block}
h2{font-size:20px}
main{padding:16px 14px 40px}
}
</style>
</head>
<body>
<header class="bar"><button class="menu" id="mb" aria-label="Abrir menú" aria-expanded="false" aria-controls="sb"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button><strong>Libro Mayor Perú</strong></header>
<div class="app">
<div class="scrim" id="scrim"></div>
<aside id="sb" aria-label="Menú principal">
  <h1>Libro Mayor Perú</h1>
  <small>Plantilla contable · PCGE</small>
  <nav id="nav" aria-label="Secciones"></nav>
</aside>
<main id="main"></main>
</div>

<script>
const IGV = 0.18;
const PCGE = [
 ['1041','Cuentas corrientes operativas','Activo'],['1011','Caja','Activo'],
 ['1212','Facturas por cobrar emitidas','Activo'],['2011','Mercaderías manufacturadas','Activo'],
 ['3331','Maquinaria y equipo','Activo'],['4011','IGV por pagar / crédito fiscal','Pasivo'],
 ['4017','Impuesto a la renta','Pasivo'],['4111','Sueldos por pagar','Pasivo'],
 ['4031','EsSalud','Pasivo'],['4071','AFP / ONP por pagar','Pasivo'],
 ['4212','Facturas por pagar emitidas','Pasivo'],['5011','Capital social','Patrimonio'],
 ['5911','Resultados acumulados','Patrimonio'],['6011','Compra de mercaderías','Gasto'],
 ['6211','Sueldos y salarios','Gasto'],['6361','Energía eléctrica y agua','Gasto'],
 ['6591','Otros gastos de gestión','Gasto'],['7011','Venta de mercaderías','Ingreso'],
 ['7591','Otros ingresos de gestión','Ingreso']
];
const DOCS = {'01':'Factura','03':'Boleta de venta','07':'Nota de crédito','08':'Nota de débito'};
const KEY='libro-mayor-pe-v1';
let S = {n:3, asientos:[
 {id:1,fecha:'2026-10-01',glosa:'Aporte inicial de capital',origen:'manual',lineas:[{c:'1041',d:50000,h:0},{c:'5011',d:0,h:50000}]},
 {id:2,fecha:'2026-10-05',glosa:'Compra de pinturas · F001-00412',origen:'compra',doc:{tipo:'01',num:'F001-00412',ruc:'20512345678',rs:'Química Andina S.A.C.',base:8000},lineas:[{c:'6011',d:8000,h:0},{c:'4011',d:1440,h:0},{c:'4212',d:0,h:9440}]},
 {id:3,fecha:'2026-10-12',glosa:'Venta de pinturas · F001-00001',origen:'venta',doc:{tipo:'01',num:'F001-00001',ruc:'20601234567',rs:'Ferretería El Maestro E.I.R.L.',base:12500},lineas:[{c:'1212',d:14750,h:0},{c:'4011',d:0,h:2250},{c:'7011',d:0,h:12500}]}
]};
try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);if(p&&p.asientos)S=p}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'S/ '+Number(n||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=n=>n?Number(n).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2}):'';
const nombre=c=>(PCGE.find(a=>a[0]===c)||[c,'(cuenta no registrada)'])[1];
const r2=n=>Math.round(n*100)/100;
const MENU=[{id:'panel',t:'Panel'},{g:'Comprobantes',items:[['ventas','Registro de ventas'],['compras','Registro de compras']]},{g:'Contabilidad',items:[['diario','Libro diario'],['mayor','Libro mayor'],['plan','Plan de cuentas'],['bal','Balance de comprobación'],['eerr','Estado de resultados']]},{g:'Impuestos',items:[['igv','IGV mensual']]},{g:'Planilla',items:[['boletas','Boletas de pago'],['afp','AFP, ONP y EsSalud']]}];
const openG=new Set(['Comprobantes','Contabilidad']);
let view='panel', tipo='venta', lines=[{c:'',d:'',h:''},{c:'',d:'',h:''}];

function saldos(){
  const m={};
  S.asientos.forEach(a=>a.lineas.forEach(l=>{const o=m[l.c]||(m[l.c]={d:0,h:0});o.d+=+l.d||0;o.h+=+l.h||0}));
  return m;
}
const sumBy=(origen,f)=>S.asientos.filter(a=>a.origen===origen).reduce((s,a)=>s+f(a),0);

function nav(){
  $('#nav').innerHTML=MENU.map(m=>{
    if(!m.g)return `<button class="lnk top" data-v="${m.id}" ${m.id===view?'aria-current="page"':''}>${m.t}</button>`;
    const act=m.items.some(x=>x[0]===view),o=openG.has(m.g);
    return `<div class="grp"><button class="lnk top${act?' has':''}" data-g="${m.g}" aria-expanded="${o}">${m.g}<span class="chev" aria-hidden="true"></span></button><div class="sub" ${o?'':'hidden'}>${m.items.map(x=>`<button class="lnk" data-v="${x[0]}" ${x[0]===view?'aria-current="page"':''}>${x[1]}</button>`).join('')}</div></div>`}).join('');
  $('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.g){const g=b.dataset.g;openG.has(g)?openG.delete(g):openG.add(g);nav();$('#nav [data-g="'+g+'"]').focus();return}
    view=b.dataset.v;render();closeMenu()};
}
function go(v){view=v;render()}
function render(){
  const m=MENU.find(x=>x.items&&x.items.some(i=>i[0]===view));if(m)openG.add(m.g);
  if(view==='ventas')tipo='venta';if(view==='compras')tipo='compra';
  const V={panel,ventas:comp,compras:comp,diario,mayor,plan,bal,eerr,igv,boletas:()=>pronto('Boletas de pago'),afp:()=>pronto('AFP, ONP y EsSalud')};
  nav();(V[view]||panel)();window.scrollTo(0,0)
}

function head(t,s,extra=''){return `<div class="top"><div><h2>${t}</h2><p class="sub">${s}</p></div>${extra}</div>`}

function panel(){
  const ventas=sumBy('venta',a=>a.doc.base), compras=sumBy('compra',a=>a.doc.base);
  const m=saldos(), c=m['4011']||{d:0,h:0}, igv=r2(c.h-c.d);
  const caja=['1041','1011'].reduce((s,k)=>s+((m[k]?.d||0)-(m[k]?.h||0)),0);
  $('#main').innerHTML=head('Panel del periodo','Octubre 2026 · valores en soles (PEN)')+`
  <div class="grid">
   <div class="kpi"><span>Ventas (base imponible)</span><b>${money(ventas)}</b></div>
   <div class="kpi"><span>Compras (base imponible)</span><b>${money(compras)}</b></div>
   <div class="kpi igv"><span>${igv>=0?'IGV por pagar a SUNAT':'Saldo a favor de IGV'}</span><b>${money(Math.abs(igv))}</b></div>
   <div class="kpi"><span>Efectivo y bancos</span><b>${money(caja)}</b></div>
  </div>
  <div class="panel"><h3>Últimos asientos</h3>${S.asientos.slice(-4).reverse().map(asientoHTML).join('')||'<p class="empty">Aún no hay asientos. Registre un comprobante o un asiento manual.</p>'}</div>
  <div class="panel"><h3>Recordatorio de obligaciones</h3><p class="sub">El IGV se declara y paga en el PDT 621 según el cronograma SUNAT por último dígito del RUC. Verifique la fecha de su periodo en el cronograma vigente; esta plantilla no la calcula.</p></div>`;
}

function asientoHTML(a){
  const td=a.lineas.reduce((s,l)=>s+(+l.d||0),0);
  return `<div class="asiento"><header><span>N.º ${String(a.id).padStart(4,'0')} · ${esc(a.glosa)}</span><span class="tag">${a.fecha}</span></header>
  <div class="scroll"><table><thead><tr><th>Cuenta</th><th>Denominación</th><th class="n">Debe</th><th class="n">Haber</th></tr></thead><tbody>
  ${a.lineas.map(l=>`<tr><td>${esc(l.c)}</td><td>${esc(nombre(l.c))}</td><td class="n">${num(l.d)}</td><td class="n">${num(l.h)}</td></tr>`).join('')}
  <tr class="tot"><td colspan="2">Totales</td><td class="n">${num(td)}</td><td class="n">${num(td)}</td></tr></tbody></table></div></div>`;
}

function comp(){
  const hoy=new Date().toISOString().slice(0,10);
  const rows=S.asientos.filter(a=>a.origen===tipo);
  const tb=rows.reduce((s,a)=>s+a.doc.base,0);
  $('#main').innerHTML=head('Registro de comprobantes','Ventas y compras con IGV del 18 % y asiento automático',
   `<div class="seg" role="group" aria-label="Tipo de registro"><button data-t="venta" aria-pressed="${tipo==='venta'}">Registro de ventas</button><button data-t="compra" aria-pressed="${tipo==='compra'}">Registro de compras</button></div>`)+`
  <div class="panel"><h3>Nuevo comprobante de ${tipo==='venta'?'venta':'compra'}</h3>
   <div class="f">
    <label>Fecha<input type="date" id="cf" value="${hoy}"></label>
    <label>Tipo de documento<select id="cd">${Object.entries(DOCS).map(([k,v])=>`<option value="${k}">${k} · ${v}</option>`).join('')}</select></label>
    <label>Serie y número<input id="cn" placeholder="F001-00023"></label>
    <label>RUC (11 dígitos)<input id="cr" inputmode="numeric" maxlength="11" placeholder="20123456789"></label>
    <label>Razón social<input id="cs"></label>
   </div>
   <div class="f">
    <label>Base imponible (S/)<input id="cb" type="number" min="0" step="0.01"></label>
    <label>IGV 18 %<input id="ci" readonly></label>
    <label>Total (S/)<input id="ct" readonly></label>
   </div>
   <button class="btn" id="cg">Registrar y generar asiento</button><p class="msg" id="cm" role="status"></p></div>
  <div class="panel"><h3>${tipo==='venta'?'Registro de ventas':'Registro de compras'}</h3>
   ${rows.length?`<div class="scroll"><table><thead><tr><th>Fecha</th><th>Documento</th><th>RUC</th><th>Razón social</th><th class="n">Base</th><th class="n">IGV</th><th class="n">Total</th></tr></thead><tbody>
   ${rows.map(a=>{const b=a.doc.base,i=r2(b*IGV);return `<tr><td>${a.fecha}</td><td>${a.doc.tipo} ${esc(a.doc.num)}</td><td>${esc(a.doc.ruc)}</td><td>${esc(a.doc.rs)}</td><td class="n">${num(b)}</td><td class="n">${num(i)}</td><td class="n">${num(r2(b+i))}</td></tr>`}).join('')}
   <tr class="tot"><td colspan="4">Totales del periodo</td><td class="n">${num(tb)}</td><td class="n">${num(r2(tb*IGV))}</td><td class="n">${num(r2(tb*(1+IGV)))}</td></tr></tbody></table></div>`:'<p class="empty">Sin comprobantes. Complete el formulario para registrar el primero.</p>'}</div>`;
  document.querySelector('.seg').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.t==='venta'?'ventas':'compras')};
  $('#cb').oninput=()=>{const b=+$('#cb').value||0;$('#ci').value=num(r2(b*IGV));$('#ct').value=num(r2(b*(1+IGV)))};
  $('#cg').onclick=()=>{
    const m=$('#cm'),b=r2(+$('#cb').value||0),ruc=$('#cr').value.trim(),n=$('#cn').value.trim(),rs=$('#cs').value.trim();
    const err=!/^\d{11}$/.test(ruc)?'El RUC debe tener 11 dígitos.':!/^[A-Z0-9]{3,4}-\d{1,8}$/i.test(n)?'Use el formato serie-número, por ejemplo F001-00023.':!rs?'Ingrese la razón social.':b<=0?'La base imponible debe ser mayor que cero.':'';
    if(err){m.className='msg bad';m.textContent=err;return}
    const i=r2(b*IGV),t=r2(b+i),v=tipo==='venta';
    const ls=v?[{c:'1212',d:t,h:0},{c:'4011',d:0,h:i},{c:'7011',d:0,h:b}]:[{c:'6011',d:b,h:0},{c:'4011',d:i,h:0},{c:'4212',d:0,h:t}];
    S.asientos.push({id:++S.n,fecha:$('#cf').value,glosa:`${v?'Venta':'Compra'} · ${n.toUpperCase()}`,origen:tipo,doc:{tipo:$('#cd').value,num:n.toUpperCase(),ruc,rs,base:b},lineas:ls});
    save();comp();$('#cm').className='msg ok';$('#cm').textContent='Comprobante registrado. Se generó el asiento N.º '+String(S.n).padStart(4,'0')+'.';
  };
}

function diario(){
  const opts='<option value="">Seleccione cuenta</option>'+PCGE.map(a=>`<option value="${a[0]}">${a[0]} · ${a[1]}</option>`).join('');
  $('#main').innerHTML=head('Libro diario','Registre asientos manuales y consulte todos los asientos del periodo')+`
  <div class="panel"><h3>Asiento manual</h3>
   <div class="f"><label>Fecha<input type="date" id="af" value="${new Date().toISOString().slice(0,10)}"></label><label>Glosa<input id="ag" placeholder="Descripción de la operación"></label></div>
   <div class="scroll"><table><thead><tr><th>Cuenta</th><th class="n">Debe</th><th class="n">Haber</th><th></th></tr></thead><tbody id="al"></tbody>
   <tfoot><tr class="tot"><td>Totales</td><td class="n" id="td">0,00</td><td class="n" id="th">0,00</td><td></td></tr></tfoot></table></div>
   <p class="msg" id="am" role="status"></p>
   <button class="btn sec" id="aa">Agregar línea</button> <button class="btn" id="as" disabled>Guardar asiento</button></div>
  <div class="panel"><h3>Asientos registrados (${S.asientos.length})</h3>${S.asientos.slice().reverse().map(asientoHTML).join('')||'<p class="empty">Todavía no hay asientos.</p>'}</div>`;
  const draw=()=>{
    $('#al').innerHTML=lines.map((l,i)=>`<tr><td><select data-i="${i}" data-k="c">${opts.replace(`value="${l.c}"`,`value="${l.c}" selected`)}</select></td><td><input data-i="${i}" data-k="d" type="number" min="0" step="0.01" value="${l.d}"></td><td><input data-i="${i}" data-k="h" type="number" min="0" step="0.01" value="${l.h}"></td><td><button class="btn sec" data-x="${i}" aria-label="Quitar línea ${i+1}">Quitar</button></td></tr>`).join('');
    tot();
  };
  const tot=()=>{
    const d=r2(lines.reduce((s,l)=>s+(+l.d||0),0)),h=r2(lines.reduce((s,l)=>s+(+l.h||0),0));
    $('#td').textContent=num(d)||'0,00';$('#th').textContent=num(h)||'0,00';
    const ok=d>0&&d===h&&lines.filter(l=>l.c&&((+l.d||0)+(+l.h||0))>0).length>=2;
    $('#as').disabled=!ok;const m=$('#am');
    if(d||h){m.className='msg '+(d===h?'ok':'bad');m.textContent=d===h?'El asiento cuadra (debe = haber).':'No cuadra: diferencia de '+money(Math.abs(d-h))+'.'}else m.textContent='';
  };
  $('#al').oninput=e=>{const t=e.target,i=t.dataset.i;if(i!=null){lines[i][t.dataset.k]=t.value;tot()}};
  $('#al').onclick=e=>{const x=e.target.dataset.x;if(x!=null&&lines.length>2){lines.splice(+x,1);draw()}};
  $('#aa').onclick=()=>{lines.push({c:'',d:'',h:''});draw()};
  $('#as').onclick=()=>{
    const g=$('#ag').value.trim();if(!g){$('#am').className='msg bad';$('#am').textContent='Escriba la glosa del asiento.';return}
    S.asientos.push({id:++S.n,fecha:$('#af').value,glosa:g,origen:'manual',lineas:lines.filter(l=>l.c&&((+l.d||0)+(+l.h||0))>0).map(l=>({c:l.c,d:+l.d||0,h:+l.h||0}))});
    lines=[{c:'',d:'',h:''},{c:'',d:'',h:''}];save();diario();
  };
  draw();
}

function plan(){
  $('#main').innerHTML=head('Plan de cuentas','Selección del Plan Contable General Empresarial (PCGE) para una distribuidora')+`
  <div class="panel"><div class="scroll"><table><thead><tr><th>Código</th><th>Denominación</th><th>Elemento</th></tr></thead><tbody>
  ${PCGE.map(a=>`<tr><td>${a[0]}</td><td>${a[1]}</td><td><span class="tag">${a[2]}</span></td></tr>`).join('')}</tbody></table></div>
  <p class="sub">Amplíe la lista PCGE en el arreglo PCGE del código según las necesidades de su empresa.</p></div>`;
}

function bal(){
  const m=saldos(),ks=Object.keys(m).sort();let T={d:0,h:0,sd:0,sa:0};
  const rows=ks.map(k=>{const o=m[k],s=r2(o.d-o.h),sd=s>0?s:0,sa=s<0?-s:0;T.d+=o.d;T.h+=o.h;T.sd+=sd;T.sa+=sa;return `<tr><td>${k}</td><td>${esc(nombre(k))}</td><td class="n">${num(o.d)}</td><td class="n">${num(o.h)}</td><td class="n">${num(sd)}</td><td class="n">${num(sa)}</td></tr>`}).join('');
  const cuadra=r2(T.d)===r2(T.h)&&r2(T.sd)===r2(T.sa);
  $('#main').innerHTML=head('Balance de comprobación','Sumas y saldos por cuenta al '+new Date().toISOString().slice(0,10))+`
  <div class="panel"><div class="scroll"><table><thead><tr><th>Cuenta</th><th>Denominación</th><th class="n">Suma debe</th><th class="n">Suma haber</th><th class="n">Saldo deudor</th><th class="n">Saldo acreedor</th></tr></thead><tbody>
  ${rows||'<tr><td colspan="6" class="empty">Sin movimientos todavía.</td></tr>'}
  <tr class="tot"><td colspan="2">Totales</td><td class="n">${num(T.d)}</td><td class="n">${num(T.h)}</td><td class="n">${num(T.sd)}</td><td class="n">${num(T.sa)}</td></tr></tbody></table></div>
  <p class="msg ${cuadra?'ok':'bad'}">${cuadra?'Las sumas y los saldos cuadran.':'Hay una diferencia entre debe y haber. Revise los asientos.'}</p>
  <button class="btn sec" id="rs">Restablecer datos de ejemplo</button></div>`;
  $('#rs').onclick=()=>{if(confirm('Se borrarán los asientos registrados. ¿Continuar?')){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}};
}
let mcta='1041';
function mayor(){
  $('#main').innerHTML=head('Libro mayor','Movimientos y saldo acumulado por cuenta')+`<div class="panel"><div class="f"><label>Cuenta<select id="mcs">${PCGE.map(a=>`<option value="${a[0]}" ${a[0]===mcta?'selected':''}>${a[0]} · ${a[1]}</option>`).join('')}</select></label></div><div id="mt"></div></div>`;
  const draw=()=>{let s=0;const rows=[];
    S.asientos.forEach(a=>a.lineas.forEach(l=>{if(l.c===mcta){s=r2(s+(+l.d||0)-(+l.h||0));rows.push(`<tr><td>${a.fecha}</td><td>N.º ${String(a.id).padStart(4,'0')}</td><td>${esc(a.glosa)}</td><td class="n">${num(l.d)}</td><td class="n">${num(l.h)}</td><td class="n">${num(Math.abs(s))} ${s<0?'A':'D'}</td></tr>`)}}));
    $('#mt').innerHTML=rows.length?`<div class="scroll"><table><thead><tr><th>Fecha</th><th>Asiento</th><th>Glosa</th><th class="n">Debe</th><th class="n">Haber</th><th class="n">Saldo (D/A)</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`:'<p class="empty">Esta cuenta no tiene movimientos en el periodo.</p>'};
  $('#mcs').onchange=e=>{mcta=e.target.value;draw()};draw();
}
function eerr(){
  const m=saldos(),f=p=>Object.keys(m).filter(k=>k[0]===p).sort();
  const ing=f('7'),gas=f('6');
  const ti=r2(ing.reduce((s,k)=>s+m[k].h-m[k].d,0)),tg=r2(gas.reduce((s,k)=>s+m[k].d-m[k].h,0));
  const row=(k,v)=>`<tr><td>${k}</td><td>${esc(nombre(k))}</td><td class="n">${num(v)}</td></tr>`;
  $('#main').innerHTML=head('Estado de resultados','Ingresos y gastos del periodo, antes de impuesto a la renta')+`<div class="panel"><div class="scroll"><table><thead><tr><th>Cuenta</th><th>Concepto</th><th class="n">Importe (S/)</th></tr></thead><tbody>
  <tr><td colspan="3"><b>Ingresos</b></td></tr>${ing.map(k=>row(k,m[k].h-m[k].d)).join('')}<tr class="tot"><td colspan="2">Total ingresos</td><td class="n">${num(ti)}</td></tr>
  <tr><td colspan="3"><b>Costos y gastos</b></td></tr>${gas.map(k=>row(k,m[k].d-m[k].h)).join('')}<tr class="tot"><td colspan="2">Total costos y gastos</td><td class="n">${num(tg)}</td></tr>
  <tr class="tot"><td colspan="2">Resultado antes de impuestos</td><td class="n">${num(r2(ti-tg))||'0,00'}</td></tr></tbody></table></div></div>`;
}
function igv(){
  const v=S.asientos.filter(a=>a.origen==='venta'),c=S.asientos.filter(a=>a.origen==='compra');
  const bv=r2(v.reduce((s,a)=>s+a.doc.base,0)),bc=r2(c.reduce((s,a)=>s+a.doc.base,0)),dv=r2(bv*IGV),cf=r2(bc*IGV),res=r2(dv-cf);
  $('#main').innerHTML=head('IGV mensual','Resumen referencial para la declaración mensual (PDT 621)')+`<div class="grid"><div class="kpi"><span>Débito fiscal (ventas)</span><b>${money(dv)}</b></div><div class="kpi"><span>Crédito fiscal (compras)</span><b>${money(cf)}</b></div><div class="kpi igv"><span>${res>=0?'IGV por pagar':'Saldo a favor'}</span><b>${money(Math.abs(res))}</b></div></div>
  <div class="panel"><div class="scroll"><table><thead><tr><th>Concepto</th><th class="n">Base imponible</th><th class="n">IGV</th></tr></thead><tbody>
  <tr><td>Ventas gravadas (${v.length} comprobantes)</td><td class="n">${num(bv)}</td><td class="n">${num(dv)}</td></tr>
  <tr><td>Compras gravadas (${c.length} comprobantes)</td><td class="n">${num(bc)}</td><td class="n">${num(cf)}</td></tr>
  <tr class="tot"><td>${res>=0?'IGV por pagar':'Saldo a favor'}</td><td></td><td class="n">${num(Math.abs(res))||'0,00'}</td></tr></tbody></table></div>
  <p class="sub">La tasa de 18 % incluye el 2 % del Impuesto de Promoción Municipal. Este resumen no contempla notas de crédito, saldos de periodos anteriores ni percepciones.</p></div>`;
}
function pronto(t){
  $('#main').innerHTML=head(t,'Módulo en preparación')+`<div class="panel"><p>Este módulo todavía no está conectado. Mientras tanto, registre el asiento de planilla en el libro diario con las cuentas 6211 (sueldos), 4111 (sueldos por pagar), 4071 (AFP y ONP) y 4031 (EsSalud).</p><button class="btn" id="pg">Ir al libro diario</button></div>`;
  $('#pg').onclick=()=>go('diario');
}
const sb=$('#sb'),sc=$('#scrim'),mb=$('#mb');
function closeMenu(){sb.classList.remove('open');sc.classList.remove('show');mb.setAttribute('aria-expanded','false')}
mb.onclick=()=>{const o=sb.classList.toggle('open');sc.classList.toggle('show',o);mb.setAttribute('aria-expanded',String(o))};
sc.onclick=closeMenu;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
matchMedia('(min-width:761px)').addEventListener('change',closeMenu);
render();
</script>
</body>
</html>
